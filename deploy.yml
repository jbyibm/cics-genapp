# Ajouter PYTHONPATH ou PYTHONUSERBASE dans les variables d'environnement Ansible pour pointer vers ~/.local/lib/python3.x/site-packages.
---
- hosts: "{{ wd_hosts if wd_hosts is defined else 'all' }}"
  gather_facts: "{{ wd_gather_facts if wd_gather_facts is defined else 'no' }}"
  serial: "{{ wd_serial if wd_serial is defined else 5 }}"
  vars:
      ansible_remote_tmp: "/tmp/jby/{{tower_job_id }}"
  collections:
    - ibm.ibm_zos_core
    - ibm.ibm_zos_wazi_deploy
  tasks:
      - name: Debug runtime user
        shell: |
          echo "=== ID ==="
          id
          echo "=== WHOAMI ==="
          whoami
          echo "=== CMDLINE ==="
          cat /proc/1/cmdline | tr '\0' ' '
          echo "=== STATUS ==="
          cat /proc/self/status | egrep 'Uid|Gid'
        delegate_to: localhost
        register: runtime_debug
      - debug:
          var: runtime_debug.stdout_lines
      - name: Print Python Version
        shell: |
          #!/bin/bash
          python3 -V
          env
          ansible --version
          whoami
          id
          
        delegate_to: localhost
      - name: Install Wazi Deploy
        ansible.builtin.pip:
          name: /runner/project/wazideploy-3.0.7.2-py3-none-any.whl
          extra_args: "--user"
        delegate_to: localhost
        
      - name: Generate Package and Deployment Plan
        shell: |
          #!/bin/bash
          export PATH=$HOME/.local/bin:$PATH
          cd /runner/project
          wazideploy-generate\
            --deploymentMethod ./wazideploy-samples/external-repos/deployment-method/static-deployment-method.yml\
            --manifests ./wazideploy-samples/application-manifest/application-manifest-static.yml\
            --deploymentPlan ./deployment-plan.yml\
            --deploymentPlanReport ./deployment-plan-report.html\
            --packageOutputFile ./package.tar\
            --configFile ./config.yml
        delegate_to: localhost

      - set_fact:
          wd_deployment_plan_file: ./deployment-plan.yml
          wd_package_file: ./package.tar

      - name: Test exact import needed by action plugin
        shell: |
          #!/bin/bash
          ls /root/.local/lib/python3.8/site-packages
          /usr/bin/python3 -c "from wazideploy.service.utilities import Utilities; print('OK Utilities import')"
        delegate_to: localhost

      - name: Test import with ansible python
        shell: /usr/local/bin/python3 -c "import sys; print(sys.executable); from wazideploy.service.utilities import Utilities; print('OK Utilities import')"
        delegate_to: localhost

      - debug:
          msg: "{{ ansible_playbook_python }}"

      - import_role:
          name: ibm.ibm_zos_wazi_deploy.zos_deploy
          
      - name: Read evidences file
        shell: |
          cat {{ wd_evidence_file }}
        register: evidences_content
        delegate_to: localhost
        changed_when: false
      
      - name: Display evidences in stdout
        debug:
          msg: |
            ====== Evidences file ======
            {{ evidences_content.stdout }}
            ===========================
        delegate_to: localhost
          
