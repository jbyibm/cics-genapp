---
rules:
  # Custom Rules
  - id: custom.cobol.rules.regex.ProgramIdRule
    severity: HIGH
    parameters:
      - name: "length"
        value: 4
  - id: custom.cobol.rules.jar.ProgramIdRule
    severity: HIGH
    parameters:
      - name: "length"
        value: 4
        
  # ZCodeScan Rules
  - id: zcodescan.cobol.rules.ProgramIdRule
    severity: INFO
  - id: zcodescan.cobol.rules.CallSyntaxRule
    severity: INFO
  - id: zcodescan.cobol.rules.SqlWhereRule
    severity: HIGH
    statements:
      - name: "Select"
        value: true
      - name: "Delete"
        value: true
      - name: "Update"
        value: true
  - id: zcodescan.cobol.rules.RequireEndClauseRule
    severity: HIGH
    statements:
      - name: "If"
        value: true
      - name: "Evaluate"
        value: true
      - name: "Read"
        value: true
      - name: "Search"
        value: true
      - name: "Call"
        value: true
  - id: zcodescan.cobol.rules.AlphaToNumericMoveRule
    severity: MEDIUM

  # PLI        
  - id: zcodescan.pli.rules.ProcedureFilenameMatchRule
  - id: zcodescan.pli.rules.FixedDecimalPrecisionRule
  - id: zcodescan.pli.rules.ImplicitDeclarationRule
  - id: zcodescan.pli.rules.GoToRule
  - id: zcodescan.pli.rules.FactorAttribRule
  - id: zcodescan.pli.rules.LoopControlRule
  - id: zcodescan.pli.rules.SingleVariableRule
  - id: zcodescan.pli.rules.ArithmeticExprWithoutBitTypeRule
  - id: zcodescan.pli.rules.DotQualRefsRule
  - id: zcodescan.pli.rules.AvoidProcessDirectiveRule
  - id: zcodescan.pli.rules.ArithmeticExprWithoutCharacterTypeRule       