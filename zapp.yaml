name: GenApp ZAPP document
author:
  name: IBM Z Open Editor
propertyGroups:
  - name: search-all
    libraries:
      - name: syslib
        type: local
        locations:
          - 'base/src'
          - 'base/pli'
profiles:
  - name: cics-genapp
    type: zcodescan
    settings:
      rules:
        - type: local
          locations:
          - "zcodescan/rules/zcodescan-genapp-rules.yaml"
      customRuleModels:
        - type: local
          locations:
          - "zcodescan/rules-domains/rules*domains.yaml"
      customRuleJars:
        - type: local
          locations:
          - "zcodescan/**/*.jar"
      baselines:
        - type: local
          locations:
            - "zcodescan/baseline.json"     
     